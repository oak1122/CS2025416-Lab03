services:
  mySQL:
    image: mysql:latest
    container_name: mySQL
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=cs2025416
      - MYSQL_DATABASE=example
      - MYSQL_USER=admin@example.com 
      - MYSQL_PASSWORD=pg2025416
    ports:
      - '3306:3306'
    volumes:
      - dataExample:/var/lib/mysql
      - ./example.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dbNetwork

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    environment:
      - PMA_HOST=mySQL
    ports:
      - '8080:80'
    networks:
      - dbNetwork

volumes:
  dataExample:

networks:
  dbNetwork: